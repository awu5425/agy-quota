<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="frame-src 'none'; child-src 'none'">
  <title>AGY Quota</title>
  <script src="/preload.js"></script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app" class="app">
    <header class="topbar">
      <div class="topbar-main">
        <div class="brand">
          <span id="status-dot" class="status-dot connecting" title="Connecting"></span>
          <h1 id="title-text" class="title">AGY 账号额度</h1>
        </div>
        <div class="topbar-actions">
          <span id="updated-at" class="updated-at" title="Last updated">--:--</span>
          <div class="segmented" role="group" aria-label="Gauge style">
            <button type="button" class="seg-btn active" data-gauge="semi-arc" id="seg-arc">半弧</button>
            <button type="button" class="seg-btn" data-gauge="classic-donut" id="seg-donut">圆环</button>
          </div>
          <div id="theme-group" class="segmented" role="group" aria-label="Theme mode">
            <button type="button" class="seg-btn active" data-theme-mode="auto" id="seg-theme-auto">跟随</button>
            <button type="button" class="seg-btn" data-theme-mode="dark" id="seg-theme-dark">暗</button>
            <button type="button" class="seg-btn" data-theme-mode="light" id="seg-theme-light">亮</button>
          </div>
          <div id="btn-lang" class="segmented" role="group" aria-label="Language">
            <button type="button" class="seg-btn" data-lang="zh" id="seg-lang-zh">中</button>
            <button type="button" class="seg-btn" data-lang="en" id="seg-lang-en">EN</button>
          </div>
          <button id="btn-refresh" type="button" class="icon-btn" title="Refresh quota" aria-label="Refresh">
            <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M13.5 8a5.5 5.5 0 1 1-1.45-3.72"/>
              <path d="M13.5 2.75v2.75h-2.75"/>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <div id="error-banner" class="banner error hidden" role="alert">
      <div class="banner-body">
        <strong id="error-title">读取失败</strong>
        <p id="error-msg"></p>
      </div>
      <button id="btn-retry" type="button" class="retry-btn">重试</button>
    </div>

    <main id="content" class="content">
      <div id="loading-state" class="loading-box">
        <div class="skel-grid" style="--qp-cols: 2;">
          <div class="skel-card"></div>
          <div class="skel-card"></div>
        </div>
        <p id="loading-text" class="muted-note">正在读取 Antigravity 账号额度...</p>
      </div>

      <section id="user-card" class="card user-card qp-user-bar hidden"></section>
      <section id="gauges-section" class="gauges-grid hidden"></section>
      <section id="trend-section" class="card section-card hidden"></section>
      <section id="credits-section" class="card section-card hidden"></section>
      <footer id="footer-bar" class="qp-footer-bar"></footer>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
